name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main", "**"]

permissions:
  contents: read

jobs:
  diff-check:
    name: SAC Diff Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run blocking SAC diff-check
        env:
          SAC_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 src/sac_scan.py diff-check --root . --base "origin/${GITHUB_BASE_REF}"

  hygiene:
    name: Repository Hygiene & Version Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hygiene Verification Gate
        run: python3 .github/scripts/check_hygiene.py

      - name: Run Version Consistency Gate
        run: python3 .github/scripts/check_version.py

  validation:
    name: SAC Validation & Index Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run SAC validate
        run: python src/sac_scan.py validate --root .

      - name: Build SAC symbol index
        run: python src/sac_scan.py index-build --root .

  smoke:
    name: MCP & CLI Smoke Tests (Python ${{ matrix.python-version }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        node-version: ["22", "24"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install MCP dependencies
        run: npm --prefix mcp ci

      - name: Run MCP & CLI smoke test
        run: node mcp/smoke.mjs

      - name: Run Track 07 DoD test suite
        run: python ci/test_track_07_dod.py

      - name: Run Track 09 DoD test suite
        run: python ci/test_track_09_dod.py

      - name: Run Track 10 DoD test suite
        run: python ci/test_track_10_dod.py
